name: Find bib portability check

on:
  push:
    branches:
      - fix-find-bib-real-library-tests
    paths:
      - '.github/workflows/find-bib-portability-check.yml'

# Temporary matrix used to verify the hotfix against stock macOS Bash 3.2.
# This run also exercises shellcheck discovery under the stock shell.
jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq fd-find ripgrep shellcheck
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          mkdir -p "$HOME/.local/bin"
      - name: Prepare dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install jq fd ripgrep shellcheck
          mkdir -p "$HOME/.local/bin"
      - name: Show runtime versions
        run: |
          bash --version | head -1
          python3 --version
          python3 -m pip --version
      - name: Install and run repository tests
        run: ./install.sh
