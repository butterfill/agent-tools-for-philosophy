name: Verify Phase 1 reference catalog

on:
  push:
    branches:
      - phase1-reference-catalog
    paths:
      - '.github/workflows/verify-phase1-reference-catalog.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: phase1-reference-catalog
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify TypeScript package
        working-directory: typescript
        run: |
          npm install
          npm test -- --runInBand
          npm run build
      - name: Verify Python package
        working-directory: python
        run: |
          python -m pip install --disable-pip-version-check uv
          uv lock
          uv run pytest
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/verify-phase1-reference-catalog.yml
          git config user.name butterfill
          git config user.email stephen.butterfill@gmail.com
          git add -A
          git commit -m "ci: remove Phase 1 verification workflow"
          git push origin HEAD:phase1-reference-catalog
