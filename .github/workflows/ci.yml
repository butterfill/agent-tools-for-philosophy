name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq fd-find ripgrep
          if command -v fdfind >/dev/null 2>&1; then
            sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fi
          python -m pip install --disable-pip-version-check -e ./python pytest pytest-asyncio

      - name: Run CLI test suite
        run: ./run-tests.sh

      - name: Run Python library tests
        run: python -m pytest python/tests
