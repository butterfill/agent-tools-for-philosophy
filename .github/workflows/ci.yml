name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq fd-find ripgrep shellcheck
          if command -v fdfind >/dev/null 2>&1; then
            sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fi

      - name: Install system dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install jq fd ripgrep shellcheck

      # The repository CLI suite must work from a plain checkout. In particular,
      # find-bib only enumerates canonical catalogue records and must not require
      # the fuzzy-search dependency merely to import ReferenceCatalog.
      - name: Run CLI test suite before Python package install
        run: ./run-tests.sh

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -e ./python pytest pytest-asyncio

      - name: Run Python library tests
        run: python -m pytest python/tests
