name: Sync Phase 2 docs

on:
  push:
    branches:
      - phase2-find-bib-reference-catalog
    paths:
      - '.github/workflows/phase2-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-find-bib-reference-catalog
          fetch-depth: 0

      - name: Update README and stale examples
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'README.md',
              '| **`find-bib`** | Search your bibliography by author, title, year, or abstract |',
              '| **`find-bib`** | Filter the complete canonical bibliography catalogue by author, title, year, DOI, or abstract |',
          )
          replace(
              'README.md',
              '# Path to your BibTeX file\nexport BIB_FILE="$HOME/documents/research/my-bibliography.bib"',
              '# Required primary/cited CSL-JSON bibliography\nexport BIB_JSON="$HOME/endnote/phd_biblio.json"\n\n# Optional complete Zotero CSL-JSON export\nexport ZOTERO_JSON="$HOME/endnote/zotero-export.json"\n\n# Path to your BibTeX file (used for BibTeX artifact commands)\nexport BIB_FILE="$HOME/documents/research/my-bibliography.bib"',
          )
          replace(
              'README.md',
              '- **`jq`** — JSON processing (required for `find-bib`, `cite2bib`, `cite2md`; [installation guide](https://github.com/jqlang/jq))',
              '- **`jq`** — JSON processing (required for `cite2bib` and `cite2md`; [installation guide](https://github.com/jqlang/jq))\n- **Python 3 + pip** — used to install/run the canonical `ReferenceCatalog` backing `find-bib`',
          )
          replace(
              'README.md',
              'brew install jq fd ripgrep',
              'brew install jq fd ripgrep python',
          )
          replace(
              'README.md',
              'sudo apt install jq fd-find ripgrep',
              'sudo apt install jq fd-find ripgrep python3 python3-pip',
          )
          replace(
              'README.md',
              '### Environment Variables\n- **`$BIB_FILE`** — Must point to your BibTeX file',
              '### Environment Variables\n- **`$BIB_JSON`** — Required primary/cited CSL-JSON bibliography; defaults to `$HOME/endnote/phd_biblio.json`\n- **`$ZOTERO_JSON`** — Optional complete-library CSL-JSON export; defaults to `$HOME/endnote/zotero-export.json`\n- **`$BIB_FILE`** — Must point to your BibTeX file',
          )
          replace(
              'README.md',
              'This will:\n1. Copy all executable tools to a directory on your PATH (tries `~/syncthing/bin`, `~/.local/bin`, or `~/bin`)\n2. Copy help text files to `help-text/` subdirectory\n3. Run the test suite to verify everything works',
              'This will:\n1. Install the canonical Python `ReferenceCatalog` runtime and dependencies beside the CLI tools\n2. Copy all executable tools to a directory on your PATH (tries `~/syncthing/bin`, `~/.local/bin`, or `~/bin`)\n3. Copy help text files to `help-text/` subdirectory\n4. Run the test suite to verify everything works',
          )
          replace(
              'README.md',
              '- The `find-bib` tests use `tests/fixtures/phd_biblio.json` (CSL-JSON)',
              '- The `find-bib` tests use primary and secondary CSL-JSON fixtures to protect canonical union/precedence behavior',
          )
          replace(
              'specs/keys2cat-spec-proposed.md',
              'find-bib --abstract "joint action" --limit 5 | keys2cat',
              'find-bib --abstract "joint action" | head -5 | keys2cat',
          )
          replace(
              'specs/package-proposal-simplify-and-extensions.md',
              'find-bib --abstract "joint action" --limit 10 | keys2cat',
              'find-bib --abstract "joint action" | head -10 | keys2cat',
          )
          PY

      - name: Commit synchronized docs
        run: |
          git config user.name butterfill
          git config user.email stephen.butterfill@gmail.com
          git add README.md specs/keys2cat-spec-proposed.md specs/package-proposal-simplify-and-extensions.md
          git commit -m "docs: align Phase 2 find-bib references"
          git push origin HEAD:phase2-find-bib-reference-catalog
